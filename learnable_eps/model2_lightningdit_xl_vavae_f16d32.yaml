# we recommend to read config_details.yaml first.

# for inference
#ckpt_path: '../pretrained_weight/lightningdit-xl-imagenet256-64ep.pt' # official weight
#ckpt_path: 'output/8_5th_lightningdit_b2_vavae_f16d3_lsun_non_eps/checkpoints/1762000.pt' # 8.5 weight
#ckpt_path: "output/14th_lightningdit_b2_vae_f16d3_lsun_interp05/checkpoints/7500000.pt" # eps weight
ckpt_path: "output/15th_lightningdit_b2_vae_f16d3_lsun_interp05_time_adp_norm/checkpoints/0110000.pt" # eps weight

data:
  data_path: '../pretrained_weight/latents_stats'
  #'path/to/your/imagenet_train_256'  # <---- path to your data. it is generated by extract_features.py.
                                                #       if you just want to inference, download our latent_status.safetensors and give its folder path here is ok.
                                                #       the path should be like this:
                                                #       imagenet_train_256/
                                                #         ├── latents_rank00_shard000.safetensors (not required for inference)
                                                #         ├── latents_rank00_shard001.safetensors (not required for inference)
                                                #         ├── ...
                                                #         └── latents_stats.pt
#  fid_reference_file: '../pretrained_weight/VIRTUAL_imagenet256_labeled.npz' # 'path/to/your/VIRTUAL_imagenet256_labeled.npz' # <---- path to your fid_reference_file.npz. download it from ADM
  fid_reference_file: "/home/ahlee/fid_npz/church_fid.npz"
  # recommend to use default settings
  image_size: 128 # 256 lsun
  num_classes: 1 #1000 lsun
  num_workers: 8 # accelerator 오류로 임시로 0으로 설정
  latent_norm: true # to normalize, channel-wise, only use for model2(DiT) latent dataset
  latent_multiplier: 1.0

# recommend to use default settings (we wil release codes with SD-VAE later)
vae:
  model_name: 'vavae_f16d32'
  downsample_ratio: 16

# recommend to use default settings
model:
  model_type: LightningDiT-B/2 #LightningDiT-L/2 #LightningDiT-XL/1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  in_chans: 3 #32
  use_checkpoint: true

# recommend to use default settings
train:
  max_steps: 8000000
  global_batch_size: 1024
  global_seed: 0

  output_dir: 'output'
  exp_name: '16th_lightningdit_b2_vae_f16d3_lsun_gmm' # <---- experiment name, set as you like
  ckpt: null
  log_every: 500
  ckpt_every: 10000 #20000
#  weight_init: '../pretrained_weight/ckpt_8th_dit/checkpoints/0013000.pt' # for train
  weight_init: 'output/8_5th_lightningdit_b2_vavae_f16d3_lsun_non_eps/checkpoints/0001000.pt'
  resume: false
optimizer:
  lr: 0.0002
  beta2: 0.95

# recommend to use default settings
transport:
  path_type: Linear
  prediction: velocity
  loss_weight: null
  sample_eps: null
  train_eps: null
  use_cosine_loss: true
  use_lognorm: true
  adaptive_eps: false #true

# recommend to use default settings
sample:
  mode: ODE
  sampling_method: euler
  atol: 0.000001
  rtol: 0.001
  reverse: false
  likelihood: false
  num_sampling_steps: 2 #250
  cfg_scale: 0.0 #10.0 # <---- cfg scale, for 800 epoch performance with FID=1.35 cfg_scale=6.7
                  #       for 64 epoch performance with FID=2.11 cfg_scale=10.0
                  #       you may find we use a large cfg_scale, this is because of 2 reasons:
                  #       we find a high-dimensional latent space requires a large cfg_scale to get good performance than f8d4 SD-VAE
                  #       we enable cfg interval, which reduces the negative effects of large cfg on high-noise parts. This means larger cfg can be utilized
  
  # recommend to use default settings
  per_proc_batch_size: 1 # batch per process(GPU)
  fid_num: 50000 #200
  cfg_interval_start: 0.11
  timestep_shift: 0.3