#ckpt_path: "../pretrained_weight/vavae-imagenet256-f16d32-dinov2.pt" # used for testing only, add your ckpt path if you want to test the model
#init_weight: "../pretrained_weight/vavae-imagenet256-f16d32-dinov2.pt" # if you want to finetune va-vae on your own dataset, add your weight_init path
#init_weight: "vavae-imagenet256-f16d32-dinov2.pt"
#init_weight: "../pretrained_weight/ckpt_7th_vae/epoch=000024.ckpt" # va-vae weight
init_weight: "../pretrained_weight/ckpt_6th_vae/model-step=131138.ckpt" # w/o va weight
#init_weight: "../pretrained_weight/ckpt_6th_vae/last.ckpt" # w/o va weight

model:
  base_learning_rate: 1.0e-04
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: val/rec_loss
    embed_dim: 32
    # hyper-param for vision foundation model alignment
    # --------------------------------------------------
    use_vf: dinov2 # dinov2_small (for eps)
    reverse_proj: true        # default: true, project from vae dim --> dinov2 dim
    # --------------------------------------------------
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 40001 # 5001 # 1 for ckpt continued training
        kl_weight: 1.0e-06
        disc_weight: 0.5
        # hyper-param for vision foundation model alignment
        # --------------------------------------------------
        vf_weight: 0.1
        adaptive_vf: true
        distmat_margin: 0.25
        cos_margin: 0.5
        # --------------------------------------------------
    ddconfig:
      double_z: true
      z_channels: 32
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 1
      - 2
      - 2
#      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8 # batch size per GPU
    wrap: true
    train:
#      target: ldm.data.imagenet.ImageNetTrain
      target: ldm.data.lsun.LSUNChurchesTrain
      params:
#        data_root: /mnt/HDD2/dataset/imagenet # d26
#        data_root: /mnt/SSD_raid1/imagenet/ # navi
#        data_root: /mnt/HDD2/dataset/cifar-100/train # d26
#        data_root: /mnt/SSD_raid1/tiny-imagenet-200/train # navi
#        npy_file: /mnt/SSD_raid1/church_outdoor_train_lmdb_color_64.npy # navi
#         npy_file: /home/ivpl-d26/church_outdoor_train_lmdb_color_64.npy # d26
        npy_file: /home/ahlee/church_outdoor_train_lmdb_color_64.npy # a6000
    validation:
#      target: ldm.data.imagenet.ImageNetValidation
      target: ldm.data.lsun.LSUNChurchesValidation
      params:
#        data_root: /mnt/HDD2/dataset/imagenet # d26
#        data_root: /mnt/SSD_raid1/imagenet/ # navi
#        data_root: /mnt/HDD2/dataset/cifar-100/val # d26
#        data_root: /mnt/SSD_raid1/tiny-imagenet-200/val # navi
#        npy_file: /mnt/SSD_raid1/church_outdoor_train_lmdb_color_64.npy # navi
#         npy_file: /home/ivpl-d26/church_outdoor_train_lmdb_color_64.npy # d26
         npy_file: /home/ahlee/church_outdoor_train_lmdb_color_64.npy # a6000

lightning:
  trainer:
    devices: 1 #8 # number of GPUs, modify it according to your settings
    num_nodes: 8 #4 # number of nodes, modify it according to your settings
    strategy: ddp_find_unused_parameters_true
    accelerator: gpu
    max_epochs: 200 #50
    precision: 32