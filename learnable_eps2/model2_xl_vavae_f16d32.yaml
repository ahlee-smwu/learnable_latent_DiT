# we recommend to read config_details.yaml first.

# for inference
ckpt_path: 'output/2nd_lightningdit_xl_vavae_f16d32_gmm30_use_weight/checkpoints/0078000.pt' # <---- download our pre-trained lightningdit or your own checkpoint

data:
  data_path: "feature_output/model1_f16d32/lsun_train_256"
#  data_path: "/mnt/HDD_raid1/ahlee/imagenet256-latents-vave-f16d32-dinov2/imagenet_train_256"
      #'path/to/your/imagenet_train_256'  # <---- path to your data. it is generated by extract_features.py.
                                                #       if you just want to inference, download our latent_status.safetensors and give its folder path here is ok.
                                                #       the path should be like this:
                                                #       imagenet_train_256/
                                                #         ├── latents_rank00_shard000.safetensors (not required for inference)
                                                #         ├── latents_rank00_shard001.safetensors (not required for inference)
                                                #         ├── ...
                                                #         └── latents_stats.pt
  valid_path: "feature_output/model1_f16d32/lsun_val_256"
  fid_reference_file: 'pretrained_weight/VIRTUAL_imagenet256_labeled.npz' # 'path/to/your/VIRTUAL_imagenet256_labeled.npz' # <---- path to your fid_reference_file.npz. download it from ADM

  # recommend to use default settings
  image_size: 256
  num_classes: 1 # 1000
  num_workers: 8
  latent_norm: true # to normalize, channel-wise
  latent_multiplier: 1.0

# recommend to use default settings (we wil release codes with SD-VAE later)
vae:
  model_name: 'vavae_f16d32'
  downsample_ratio: 16

# recommend to use default settings
model:
  model_type: LightningDiT-XL/1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  in_chans: 32

# recommend to use default settings
train:
  max_steps: 80000
  global_batch_size: 128 #64 per 1 a6000
  global_seed: 0
  output_dir: 'output'
  exp_name: '4th_lightningdit_xl_vavae_f16d32_gmm30_use_weight' # <---- experiment name, set as you like
  ckpt: null
  log_every: 100
  ckpt_every: 6000 #3000
#  weight_init: '../pretrained_weight/lightningdit-xl-imagenet256-64ep.pt'
  resume: true
optimizer:
  lr: 0.0002
  beta2: 0.95
  
# recommend to use default settings
transport:
  path_type: Linear
  prediction: velocity
  loss_weight: null
  sample_eps: null
  train_eps: null
  use_cosine_loss: true
  use_lognorm: true

# recommend to use default settings
sample:
  mode: ODE
  sampling_method: euler
  atol: 0.000001
  rtol: 0.001
  reverse: false
  likelihood: false
  num_sampling_steps: 20 #250
  cfg_scale: 0 #10.0 # <---- cfg scale, for 800 epoch performance with FID=1.35 cfg_scale=6.7
                  #       for 64 epoch performance with FID=2.11 cfg_scale=10.0
                  #       you may find we use a large cfg_scale, this is because of 2 reasons:
                  #       we find a high-dimensional latent space requires a large cfg_scale to get good performance than f8d4 SD-VAE
                  #       we enable cfg interval, which reduces the negative effects of large cfg on high-noise parts. This means larger cfg can be utilized
  
  # recommend to use default settings
  per_proc_batch_size: 256
  fid_num: 90000 #50000
  cfg_interval_start: 0.11
  timestep_shift: 0.3

# clustering
cluster_type: gmm # kmeans, gmm

kmeans:
    num_clusters: 10 # 10,20,50
    use_pca: false
    pca_dim: 4
    closest_point: false
    output_dir: 'MGD3_kmeans/result' # for fit
    exp_name: 'kmeans' # 안 쓰는 듯?
    load_dir: 'MGD3_kmeans/result_gmm/30' # for usage

gmm:
    num_clusters: 30 # 10,20,50
    use_pca: true
    pca_dim: 256
    cov_type: diag # diag, full
    init_dir: 'MGD3_kmeans/result' # kmeans로 초기화함
    output_dir: 'GMM/result_proba_lsun' # for fit
#    exp_name: 'kmeans' # 안 쓰는 듯?
    load_dir: 'GMM/result_proba_lsun/30_diag' # for usage
    use_weight: true # gmm weight for sampling cluster idx